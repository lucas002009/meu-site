<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ouzadia</title>
<script>
  /* Hospedagem estatica (GitHub Pages) nao tem a rota /:id do server.js.
     Esta pagina recebe /abc123 (ou /meu-site/abc123) e leva para r.html?c=abc123. */
  (function () {
    var partes = location.pathname.split("/").filter(Boolean);
    var subpasta = location.hostname.endsWith(".github.io") && partes.length > 1;
    var base = subpasta ? "/" + partes[0] + "/" : "/";
    var id = partes[partes.length - 1];
    if (partes.length === (subpasta ? 2 : 1) && /^[a-zA-Z0-9_-]{2,64}$/.test(id)) {
      location.replace(base + "r.html?c=" + encodeURIComponent(id));
    } else {
      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("inicio").href = base;
      });
    }
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #06251c; color: #f6f2e9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
  a { color: #e6c65c; }
</style>
</head>
<body>
  <main>
    <p>Página não encontrada.</p>
    <p><a id="inicio" href="/">Voltar ao início</a></p>
  </main>
</body>
</html>
